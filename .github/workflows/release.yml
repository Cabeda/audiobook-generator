name: Release

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get latest tag
        id: get_tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG"

      - name: Get commits since last tag
        id: commits
        run: |
          LATEST_TAG="${{ steps.get_tag.outputs.latest_tag }}"
          if [ "$LATEST_TAG" = "v0.0.0" ]; then
            COMMITS=$(git log --pretty=format:"%s" HEAD)
          else
            COMMITS=$(git log --pretty=format:"%s" ${LATEST_TAG}..HEAD)
          fi
          # The release commit must not start another release.
          COMMITS=$(echo "$COMMITS" | grep -v "^chore(release)" || true)
          echo "$COMMITS" > /tmp/commits.txt
          echo "Commits since $LATEST_TAG:"
          cat /tmp/commits.txt

      - name: Determine version bump type
        id: version_bump
        run: |
          COMMITS=$(cat /tmp/commits.txt)
          if echo "$COMMITS" | grep -qE "(BREAKING CHANGE:|^[a-z]+!:)"; then
            echo "bump_type=major" >> $GITHUB_OUTPUT
            echo "Version bump: MAJOR (breaking changes detected)"
          # Check for new features (feat:)
          elif echo "$COMMITS" | grep -qE "^feat(\(.*\))?:"; then
            echo "bump_type=minor" >> $GITHUB_OUTPUT
            echo "Version bump: MINOR (new features detected)"
          # Check for any conventional commits (fix:, docs:, etc.)
          elif echo "$COMMITS" | grep -qE "^(fix|perf|refactor|style|test|build|ci|chore|docs)(\(.*\))?:"; then
            echo "bump_type=patch" >> $GITHUB_OUTPUT
            echo "Version bump: PATCH (fixes or other changes detected)"
          else
            echo "bump_type=none" >> $GITHUB_OUTPUT
            echo "Version bump: NONE (no conventional commits detected)"
          fi

      - name: Bump the version
        id: bump_version
        if: steps.version_bump.outputs.bump_type != 'none'
        run: |
          # The version is bumped without a commit or a tag: the branch and the
          # tag are made once the change is on main.
          bun pm version --no-git-tag-version ${{ steps.version_bump.outputs.bump_type }}

          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Open the release pull request
        if: steps.version_bump.outputs.bump_type != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.bump_version.outputs.new_version }}
          LATEST_TAG: ${{ steps.get_tag.outputs.latest_tag }}
        run: |
          BRANCH="release/v${NEW_VERSION}"

          # The changelog covers the commits since the last tag, not the
          # release commit itself.
          {
            echo "## What's Changed"
            echo ""
            git log --pretty=format:"- %s (%h)" ${LATEST_TAG}..HEAD
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${LATEST_TAG}...v${NEW_VERSION}"
          } > /tmp/changelog.md

          git checkout -B "$BRANCH"
          git add package.json
          git commit -m "chore(release): v${NEW_VERSION}"
          # The branch only ever carries the version bump, so a re-run may
          # replace it.
          git push --force origin "$BRANCH"

          # A re-run must not fail because the pull request is already open.
          if gh pr list --head "$BRANCH" --state open --json number | grep -q '"number"'; then
            echo "The release pull request is already open: $BRANCH"
            exit 0
          fi

          gh pr create \
            --title "chore(release): v${NEW_VERSION}" \
            --body-file /tmp/changelog.md \
            --base main \
            --head "$BRANCH"
